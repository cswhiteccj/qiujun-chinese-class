name: Bootstrap Qiujun V3.1

on:
  push:
    paths:
      - '_bootstrap/**'
      - '.github/workflows/bootstrap-v31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild customization patch
        run: |
          cat _bootstrap/patch-*.b64 | base64 -d | gzip -d > /tmp/qiujun.patch
          test -s /tmp/qiujun.patch

      - name: Import upstream and apply Qiujun customization
        run: |
          git clone --depth 1 https://github.com/lienyujen/InterAct.git /tmp/interact
          rsync -a --exclude='.git' /tmp/interact/ ./
          patch -p1 < /tmp/qiujun.patch
          rm -rf _bootstrap
          rm -f .github/workflows/bootstrap-v31.yml

      - name: Commit complete V3.1 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete Qiujun Chinese Class V3.1' || exit 0
          git push origin HEAD:main
